[workspace]
resolver = "2"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = "s"
strip = true

[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

# Custom-shader hook for GPUI (see vendor/PATCH.md): three crates of the pinned gpui-kit 0.9.1 stack, vendored with a small patch.
# Same versions as the pins, so Cargo.lock only changes their source line.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.12" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.12" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.12" }
