[package]
name = "rune-desktop"
version.workspace = true
edition.workspace = true
publish = false
description = "rune desktop: the native (GPUI) frontend for the rune music server"

[[bin]]
name = "rune-desktop"
path = "src/main.rs"

[dependencies]
rune-mini-core = { path = "../../linux/core" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
