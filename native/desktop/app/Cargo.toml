[package]
name = "rune-desktop"
version.workspace = true
edition.workspace = true
publish = false
description = "rune desktop: the native (GPUI) frontend for the rune music server"

[[bin]]
name = "rune-desktop"
path = "src/main.rs"

[dependencies]
rune-mini-core = { path = "../../linux/core" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "aac", "isomp4", "alac", "wav", "aiff", "ogg", "vorbis", "pcm"] }
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.15"

# OS integration (src/os): Linux speaks D-Bus (MPRIS, tray, notifications, single instance), macOS the media frameworks
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSDictionary", "NSObject"] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem", "block2"] }

[dev-dependencies]
# checks that shaders/foil.wgsl is valid WGSL (the Linux/wgpu side of the shader hook) without a GPU
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
# GPU time of the foil shader (an ignored test in src/gpubench.rs): Linux only, the same wgpu features gpui-wgpu uses
[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }
pollster = "0.4"
