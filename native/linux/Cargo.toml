[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = "s"
strip = true

[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2
